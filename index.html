<!doctype html>
<html lang="bn" style="background-color: #090d16; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#090d16" />
    <title>AgriMach - ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার</title>
    <meta name="description" content="খুচরা যন্ত্রাংশ শপ" />

    <!-- Instant Dark Viewport Style (Paints dark canvas immediately before external assets or JS load) -->
    <style>
      :root, html, body {
        background-color: #090d16 !important;
        color: #f8fafc;
        color-scheme: dark;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #root {
        background-color: #090d16 !important;
        min-height: 100vh;
      }
    </style>

    <!-- Open Graph / WhatsApp / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgriMach" />
    <meta property="og:url" content="https://agrimach-parts.web.app/" />
    <link rel="canonical" href="https://agrimach-parts.web.app/" />
    <meta property="og:title" content="AgriMach - ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার" />
    <meta property="og:description" content="খুচরা যন্ত্রাংশ শপ" />
    <meta property="og:image" content="https://agrimach-parts.web.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://agrimach-parts.web.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="AgriMach - ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার খুচরা যন্ত্রাংশ শপ" />

    <!-- Schema.org item props for Google and WhatsApp crawler -->
    <meta itemprop="name" content="AgriMach - ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার" />
    <meta itemprop="description" content="খুচরা যন্ত্রাংশ শপ" />
    <meta itemprop="image" content="https://agrimach-parts.web.app/og-image.jpg" />
    <link rel="image_src" href="https://agrimach-parts.web.app/og-image.jpg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://agrimach-parts.web.app/" />
    <meta name="twitter:title" content="AgriMach - ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার" />
    <meta name="twitter:description" content="খুচরা যন্ত্রাংশ শপ" />
    <meta name="twitter:image" content="https://agrimach-parts.web.app/og-image.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="alternate icon" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
  </head>
  <body style="background-color: #090d16; color: #f8fafc; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <!-- Inline Initial Splash Loader (Replaced automatically when React mounts) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090d16; color: #f8fafc; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#090d16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.9 6.9a2.12 2.12 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        </div>
        <div style="font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; margin-bottom: 4px;">AgriMach</div>
        <div style="font-size: 13px; color: #94a3b8; font-weight: 500; margin-bottom: 24px;">ট্র্যাক্টর, জেসিবি ও হার্ভেস্টার স্পেয়ার্স</div>
        <div style="display: flex; align-items: center; gap: 10px; color: #f59e0b; font-size: 13px; font-weight: 600; background: rgba(245, 158, 11, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(245, 158, 11, 0.2);">
          <div style="width: 14px; height: 14px; border: 2px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: agrimach-spin 0.8s linear infinite;"></div>
          <span>অ্যাপ লোড হচ্ছে...</span>
        </div>
        <style>
          @keyframes agrimach-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
            })
            .catch(err => console.error('Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
