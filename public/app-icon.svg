<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Heavy Industrial Gear Ring -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- 8 Gear Teeth -->
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(45)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(90)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(135)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(180)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(225)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(270)" fill="url(#goldGrad)"/>
    <path d="M-30,-190 L30,-190 L24,-150 L-24,-150 Z" transform="rotate(315)" fill="url(#goldGrad)"/>

    <!-- Gear Body Circle -->
    <circle r="155" fill="url(#goldGrad)"/>
    <circle r="120" fill="#0f172a"/>
    <circle r="112" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,6"/>
  </g>

  <!-- Tractor Tire Tread Marks / Agricultural chevron elements -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M210,130 L256,165 L302,130 L314,146 L256,190 L198,146 Z" />
    <path d="M210,382 L256,347 L302,382 L314,366 L256,322 L198,366 Z" />
  </g>

  <!-- Center Crossed Heavy Wrench & Piston Emblem -->
  <g transform="translate(256, 256)">
    <!-- Crossed Mechanical Wrench 1 -->
    <g transform="rotate(45)">
      <rect x="-14" y="-105" width="28" height="210" rx="14" fill="url(#metallicGrad)"/>
      <!-- Top Open Jaw -->
      <path d="M-35,-105 C-35,-135 35,-135 35,-105 C35,-90 20,-85 20,-85 L-20,-85 C-20,-85 -35,-90 -35,-105 Z" fill="url(#metallicGrad)"/>
      <circle cx="0" cy="-105" r="16" fill="#0f172a"/>
      <!-- Bottom Ring -->
      <circle cx="0" cy="100" r="30" fill="url(#metallicGrad)"/>
      <circle cx="0" cy="100" r="15" fill="#0f172a"/>
    </g>

    <!-- Crossed Mechanical Wrench 2 -->
    <g transform="rotate(-45)">
      <rect x="-14" y="-105" width="28" height="210" rx="14" fill="url(#orangeGrad)"/>
      <!-- Top Open Jaw -->
      <path d="M-35,-105 C-35,-135 35,-135 35,-105 C35,-90 20,-85 20,-85 L-20,-85 C-20,-85 -35,-90 -35,-105 Z" fill="url(#orangeGrad)"/>
      <circle cx="0" cy="-105" r="16" fill="#0f172a"/>
      <!-- Bottom Ring -->
      <circle cx="0" cy="100" r="30" fill="url(#orangeGrad)"/>
      <circle cx="0" cy="100" r="15" fill="#0f172a"/>
    </g>

    <!-- Center Core Hub Nut -->
    <circle r="36" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8"/>
    <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#goldGrad)"/>
  </g>
</svg>
